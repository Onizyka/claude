name: Multiplication app

on:
  push:
    paths:
      - "multiplication/**"
      - ".github/workflows/multiplication.yml"
  pull_request:
    paths:
      - "multiplication/**"
      - ".github/workflows/multiplication.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: multiplication

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия: $VERSION"

      - name: Unit tests
        run: ./gradlew test --stacktrace

      # Если в репозитории есть секреты подписи (SIGNING_*), собирается release с постоянным ключом:
      # новые версии ставятся поверх старых. Иначе — debug-сборка.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "official=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секреты подписи не заданы — собирается debug APK."
            echo "official=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.signing.outputs.official == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/multiplication-${{ steps.version.outputs.name }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build debug APK
        if: steps.signing.outputs.official != 'true'
        run: |
          ./gradlew assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/multiplication-${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multiplication-${{ steps.version.outputs.name }}
          path: multiplication/dist/*.apk

      # APK на странице Releases удобно скачать прямо с телефона.
      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: multiplication-v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Таблица умножения ${{ steps.version.outputs.name }}
          body: |
            Тренажёр таблицы умножения для детей. Скачайте APK ниже и установите на телефон
            (Android 8.0 и новее; может понадобиться разрешить установку из неизвестных источников).
          files: multiplication/dist/*.apk
          make_latest: false
